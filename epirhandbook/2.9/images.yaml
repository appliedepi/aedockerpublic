# epirhandbook/2.9/images.yaml: the v2.9 catalog of group images. It uses the
# same schema as the catalogs of 2.5 to 2.8, which are in git history. The
# validate_catalog function in .github/scripts/plan.py gives the field rules.
# plan.py loads this file TOGETHER WITH the root images.yaml, because base
# edges cross the two files: epirhandbook-common here is FROM rbase there.
# See the load_catalogs docstring in plan.py.
#
# v2.9 puts the nine images of v2.8 on the per-language layout of the
# handbook. The images, the groups and the package lists are the same as in
# v2.8. Each language is now its own Quarto book project, so chapter S of
# language L is the source file content/L/S.qmd.
#
# A `renders` entry names the file in the MAIN language, content/en/<stem>.qmd.
# The group image that owns a stem renders that stem in EVERY language. The
# entry states which image owns the chapter. It does not list the files that
# the image gets. plan.py reads the stem from the last path segment.
#
# Each of the six GROUP images renders several chapters, given as a LIST in
# `renders`. The layout states group membership: the package list of each
# chapter is in the directory of the group image that renders it, as
# groups/<group>/packages_cran_<stem>.txt. generate_groups.py compares the
# `renders` lists below with that layout, group by group and in both
# directions. `index` needs no special case. It is content/en/index.qmd, in
# the same directory as every other chapter of that language.
#
# epirhandbook-monolith is the last record below. The comment above it says
# why it has no `renders`.
images:
  - name: epirhandbook-common
    description: "Shared R environment for the Epi R Handbook: the packages every chapter needs"
    dir: epirhandbook/2.9/common
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "rbase:4.6.0-2026-07-01"
    live: true
  - name: epirhandbook-analysis
    description: "R environment for the Analysis chapters of the Epi R Handbook"
    renders:
      - content/en/tables_descriptive.qmd
      - content/en/stat_tests.qmd
      - content/en/regression.qmd
      - content/en/missing_data.qmd
      - content/en/standardization.qmd
      - content/en/moving_average.qmd
      - content/en/time_series.qmd
      - content/en/contact_tracing.qmd
      - content/en/survey_analysis.qmd
      - content/en/survival_analysis.qmd
      - content/en/gis.qmd
    dir: epirhandbook/2.9/groups/analysis
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  - name: epirhandbook-basics
    description: "R environment for the Basics chapters of the Epi R Handbook"
    renders:
      - content/en/index.qmd
      - content/en/editorial_style.qmd
      - content/en/data_used.qmd
      - content/en/basics.qmd
      - content/en/transition_to_r.qmd
      - content/en/packages_suggested.qmd
      - content/en/r_projects.qmd
      - content/en/importing.qmd
    dir: epirhandbook/2.9/groups/basics
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  - name: epirhandbook-data-management
    description: "R environment for the Data Management chapters of the Epi R Handbook"
    renders:
      - content/en/cleaning.qmd
      - content/en/dates.qmd
      - content/en/characters_strings.qmd
      - content/en/factors.qmd
      - content/en/pivoting.qmd
      - content/en/grouping.qmd
      - content/en/joining_matching.qmd
      - content/en/deduplication.qmd
      - content/en/iteration.qmd
    dir: epirhandbook/2.9/groups/data-management
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  - name: epirhandbook-data-viz
    description: "R environment for the Data Visualization chapters of the Epi R Handbook"
    renders:
      - content/en/tables_presentation.qmd
      - content/en/ggplot_basics.qmd
      - content/en/ggplot_tips.qmd
      - content/en/epicurves.qmd
      - content/en/age_pyramid.qmd
      - content/en/heatmaps.qmd
      - content/en/diagrams.qmd
      - content/en/combination_analysis.qmd
      - content/en/transmission_chains.qmd
      - content/en/phylogenetic_trees.qmd
      - content/en/interactive_plots.qmd
    dir: epirhandbook/2.9/groups/data-viz
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  - name: epirhandbook-reports
    description: "R environment for the Reports and dashboards chapters of the Epi R Handbook"
    renders:
      - content/en/rmarkdown.qmd
      - content/en/reportfactory.qmd
      - content/en/flexdashboard.qmd
      - content/en/shiny_basics.qmd
    dir: epirhandbook/2.9/groups/reports
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  - name: epirhandbook-miscellaneous
    description: "R environment for the Miscellaneous chapters of the Epi R Handbook"
    renders:
      - content/en/writing_functions.qmd
      - content/en/directories.qmd
      - content/en/collaboration.qmd
      - content/en/errors.qmd
      - content/en/help.qmd
      - content/en/network_drives.qmd
      - content/en/data_table.qmd
    dir: epirhandbook/2.9/groups/miscellaneous
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
  # The monolith: every package from all six groups in one image. It renders
  # NOTHING. It exists for contributors: .devcontainer.json in the handbook
  # repo points at it. A contributor who opens the book in a dev container
  # then has an environment that can render any chapter.
  #
  # For this reason it has no `renders` key, and it is beside groups/, not in
  # it. plan.py needs a `renders` list from each image under a `groups` path
  # segment. The monolith can declare no valid list, because the six groups
  # already claim all 50 chapters and no .qmd can be claimed twice.
  # `epirhandbook-common` has no `renders` for the same reason.
  - name: epirhandbook-monolith
    description: "R environment for every chapter of the Epi R Handbook, the union of the six group images"
    dir: epirhandbook/2.9/monolith
    context: epirhandbook/2.9
    tags: ["2.9"]
    base: "epirhandbook-common:2.9"
    live: true
