# groups.yaml -- HAND-MAINTAINED source of truth for v2.8 group-image
# membership. This file is the ONLY place chapter-to-group assignment is
# decided; generate_groups.py reads it and WRITES the group package lists
# (epirhandbook/2.8/groups/<group>/packages_cran.txt) and the monolith list
# (epirhandbook/2.8/groups/monolith/packages_cran.txt) FROM it -- never the
# other way round. Do not hand-edit any packages_cran.txt under
# epirhandbook/2.8/groups/; edit this file and rerun generate_groups.py.
#
# v2.7 publishes 49 per-chapter images. v2.8 collapses them into 6 group
# images (listed below) plus an autogenerated monolith (the union of all 6).
# A group's package list is the plain UNION of its member chapters' own full
# epirhandbook/2.7/chapters/<stem>/packages_cran.txt lists -- nothing is
# subtracted for the shared `common` base; see generate_groups.py's module
# docstring for why that must stay a superset relationship.
#
# Group keys (basics, data-management, ...) use HYPHENS because they become
# Docker image name components. Chapter stems (transition_to_r, ...) use
# UNDERSCORES because they are literal epirhandbook/2.7/chapters/<stem>/
# directory names. Neither is "normalised" to match the other -- both
# spellings are load-bearing exactly as written here.
#
# Every one of the 49 v2.7 chapters must appear in EXACTLY one group below.
# generate_groups.py enforces this (fails loudly on a chapter claimed by no
# group, a chapter claimed twice, or a chapter stem that doesn't exist under
# epirhandbook/2.7/chapters/) -- it is not just a convention, it is checked.
groups:
  basics:
    - index
    - editorial_style
    - data_used
    - basics
    - transition_to_r
    - packages_suggested
    - r_projects
    - importing
  data-management:
    - cleaning
    - dates
    - characters_strings
    - factors
    - pivoting
    - grouping
    - joining_matching
    - deduplication
    - iteration
  analysis:
    - tables_descriptive
    - stat_tests
    - regression
    - missing_data
    - standardization
    - moving_average
    - time_series
    - contact_tracing
    - survey_analysis
    - survival_analysis
  data-viz:
    - tables_presentation
    - ggplot_basics
    - ggplot_tips
    - epicurves
    - age_pyramid
    - heatmaps
    - diagrams
    - combination_analysis
    - transmission_chains
    - phylogenetic_trees
    - interactive_plots
  reports:
    - rmarkdown
    - reportfactory
    - flexdashboard
    - shiny_basics
  miscellaneous:
    - writing_functions
    - directories
    - collaboration
    - errors
    - help
    - network_drives
    - data_table
