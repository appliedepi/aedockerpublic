# rbase SSH hardening. sshd reads this file through Ubuntu's default
# `Include /etc/ssh/sshd_config.d/*.conf` in /etc/ssh/sshd_config. The
# build-time check in rbase/4.6.0/Dockerfile asserts these values in the EFFECTIVE config via
# `sshd -T`, not only in this source file.
#
# Key-only access, with no password path of any kind, for every user:
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Root can log in ONLY with a key. There is no other user in this image, and
# SSH_PUBKEY installs its key for root (see entrypoint.sh). prohibit-password
# and without-password are the same setting. Older OpenSSH prints the second
# name in `sshd -T`; OpenSSH 10.x on Ubuntu 26.04 prints the first.
PermitRootLogin prohibit-password

# Phase 4 hardening (finding 9). The one valid use of SSH in this container
# is an interactive shell for the operator who supplied SSH_PUBKEY. None of
# the five features below is part of that use. Each one can turn an SSH
# session into something else: a relay into any network the container can
# reach, a tunnel out, an X11 display hijack, or a second identity that uses
# the operator's own agent. So all five are off for every user.
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
AllowAgentForwarding no
