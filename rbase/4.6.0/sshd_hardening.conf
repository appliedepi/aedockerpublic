# rbase SSH hardening. Read automatically via Ubuntu's default
# `Include /etc/ssh/sshd_config.d/*.conf` in /etc/ssh/sshd_config (verified
# present in the jammy openssh-server package -- see rbase/4.3.2/Dockerfile's
# build-time check, which asserts these values in the EFFECTIVE config via
# `sshd -T`, not just in this source file).
#
# Key-only access, no password path of any kind, no matter who connects as:
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Root may log in ONLY with a key (there is no other user in this image, and
# SSH_PUBKEY installs its key for root -- see entrypoint.sh). sshd reports
# this back as "without-password" under `sshd -T` -- prohibit-password and
# without-password are the same setting; OpenSSH just normalizes to the
# latter name when dumping effective config.
PermitRootLogin prohibit-password

# Phase 4 hardening (finding 9): this container's one legitimate use of SSH
# is an interactive shell for the operator who supplied SSH_PUBKEY. None of
# these forwarding/tunneling features are that use case, and each is a way
# an SSH session could be repurposed into something else (a relay into
# whatever network the container can reach, a tunnel out, an X11 display
# hijack, or a second identity riding the operator's own agent) -- so all
# five are switched off regardless of who authenticates.
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
AllowAgentForwarding no
