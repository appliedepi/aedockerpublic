# images.yaml: the image catalog. It is the single source of truth for what
# is built, in what order, and where.
#
# Read by: .github/scripts/plan.py (the CI planner) and .github/scripts/
# changed_images.py (decides WHICH images changed).
#
# Fields:
#   name        Image name. Published as ghcr.io/<owner>/<repo>/<name>:<tag>
#               (repo lowercased from GITHUB_REPOSITORY).
#   description One line about the image, published as its
#               org.opencontainers.image.description OCI label. REQUIRED.
#               Without it, the image keeps the description of its base. For
#               rbase, that is Canonical's text for ubuntu.
#   dir         The image's own directory, relative to the repo root, where
#               its Dockerfile is. It is the build context unless `context`
#               is set. It is also THIS image's change-detection scope.
#               changed_images.py rebuilds this image iff one of these
#               changed since the commit that its CURRENTLY-PUBLISHED tag was
#               built from (its org.opencontainers.image.revision OCI label):
#               a file under `dir`, a shared build-context input, or the
#               .github/ build machinery (see the header of that module).
#               Never published, or no revision label -> always rebuild.
#   tags        List of tags to publish. The local `docker build -t` uses the
#               first tag. All tags are pushed.
#   base        "<name>:<tag>" of another image IN THIS CATALOG that this
#               image's Dockerfile is FROM. Null if it has none, that is, if
#               its Dockerfile is FROM something external, like ubuntu:jammy.
#               This edge drives the cascade: a rebuild of `base` forces a
#               rebuild of everything FROM it, transitively.
#   live        true  = eligible for the CASCADE: a rebuild of `base`
#                       automatically rebuilds this image too, transitively.
#               false = opts OUT of that automatic cascade only. A DIRECT
#                       edit to this image's own `dir` still builds it,
#                       because an explicit change must stay buildable.
#                       `live: false` only means "do not rebuild me
#                       automatically when my base moves."
#
# ONE rule (owner-designed) replaces two older mechanisms: the per-image
# republish-guard field, and the special case "images.yaml or a workflow
# file changed -> rebuild everything". The rule: rebuild and republish an
# image iff its own files changed since the commit that its
# CURRENTLY-PUBLISHED image was built from. That commit comes from the
# image's org.opencontainers.image.revision OCI label. build_image.sh stamps
# the label. changed_images.py reads it with a metadata-only registry read,
# never a `docker pull`. A .github/ machinery change shows up in EVERY
# image's own diff, so the old special case is not needed.
#
# An image with a `base` also carries org.opencontainers.image.base.digest,
# the digest of the exact base it was built FROM. changed_images.py rebuilds
# a live image with a base in three more cases:
#   - that label is missing;
#   - the base's published digest cannot be read;
#   - the label differs from that digest.
# The revision label alone cannot show a moved base: a change under the
# base's `dir` is not in the dependent's own diff. The two rules together are
# the RESUME mechanism after a partial publish: an image that published is
# skipped on a rerun, and one that failed is rebuilt.
#
# Trust boundary: a base that this rule decides NOT to rebuild is trusted to
# be unchanged. build_image.sh resolves its digest live from whatever its
# published tag currently points to. A retag or force-push out of band moves
# that digest. So every live image FROM the base rebuilds on the next run,
# FROM the moved tag. Nothing checks the moved base itself: that is an
# accepted trust boundary.

images:
  # The rbase date tag is MUTABLE on purpose. Do not make it immutable.
  #
  # 4.6.0-2026-07-01 names the R version and the CRAN snapshot date. Each
  # rbase rebuild overwrites it in the registry. It was rewritten at least
  # eight times, across nine package versions. The date names the CRAN
  # snapshot that the image was built against. It does not claim that the
  # bytes never change. The build derives the snapshot URL from this tag, and
  # the tag is the single source of truth for it.
  #
  # A reviewer can read "date-pinned tag" as "immutable" and report a
  # supply-chain defect. Box F27 of appliedepi/epirhandbook#455 reported it,
  # and it was declined there for this reason. For byte-immutability of a
  # particular build, pin the DIGEST at the point of use.
  - name: rbase
    description: "Base R 4.6.0 image built from a dated CRAN snapshot, used by the Epi R Handbook images"
    dir: rbase/4.6.0
    tags: ["4.6.0-2026-07-01"]
    base: null
    live: true
