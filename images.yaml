# images.yaml — the image catalog. Single source of truth for what gets
# built, in what order, and where.
#
# Read by: .github/scripts/plan.py (the CI planner) and by anyone building
# locally who wants to know the current base_digest pin.
#
# Fields:
#   name        Image name. Published as ghcr.io/<owner>/<repo>/<name>:<tag>
#               (repo lowercased from GITHUB_REPOSITORY).
#   dir         Build context, relative to repo root. A changed file under
#               this directory marks this image "directly changed" for the
#               selective build (.github/workflows/build.yml).
#   tags        List of tags to publish. First tag is used for the local
#               `docker build -t` invocation; all tags are pushed.
#   base        "<name>:<tag>" of another image IN THIS CATALOG that this
#               image's Dockerfile is FROM, or null if it has none (i.e. its
#               Dockerfile FROMs something external, like ubuntu:jammy).
#               This edge drives the cascade: a rebuild of `base` forces a
#               rebuild of everything FROM it, transitively.
#   base_digest The last known-good digest of `base`, e.g.
#               "sha256:abcd...". null until the base has been published at
#               least once. See "Digest-pinning procedure" below — this is
#               the steady-state pin; it is NOT consulted when `base` is
#               ALSO being rebuilt in the same CI run (that case re-resolves
#               the digest fresh from the registry instead, since the run
#               just pushed it).
#   live        true  = included in the nightly full rebuild, and in the
#                       "images.yaml or a workflow file changed -> rebuild
#                       everything" special case.
#               false = frozen from AUTOMATIC rebuilds. A direct edit to
#                       this image's own `dir` still builds it (an explicit
#                       change must still be buildable), but it is never
#                       swept in by the nightly schedule, by the
#                       images.yaml/workflow special case, or by a cascade
#                       from its base rebuilding. Freezing a version means
#                       nothing rebuilds it automatically. (This is about
#                       WHO TRIGGERS a build; see `frozen` below for WHETHER
#                       A SUCCESSFUL BUILD IS ALLOWED TO PUBLISH.)
#   frozen      true  = this image's whole point is that its content never
#                       moves once published. build_image.sh enforces this:
#                       in "publish" mode, it REFUSES to push any tag of a
#                       `frozen: true` image that already exists in the
#                       registry, UNLESS the image's name is explicitly
#                       listed in build.yml's workflow_dispatch input
#                       `force_republish_frozen`. So a frozen image is
#                       published exactly once -- by WHICHEVER run of
#                       build.yml first reaches that tag (an ordinary push
#                       to main is enough; build.yml is not human-triggered
#                       only -- see its `on:` block), not necessarily a
#                       human manually dispatching the workflow. What IS a
#                       deliberate, human-supplied, one-time action is the
#                       OVERRIDE that replaces an already-published frozen
#                       tag: force_republish_frozen, never set by
#                       automation (nightly.yml has no such input and never
#                       pushes at all -- see nightly.yml's header for why
#                       it can never republish anything). Both images in
#                       this catalog are frozen: the whole premise of this
#                       project is that this exact stack does not move once
#                       it reproduces the target render.
#               false = (or omitted) no such refusal; a normal publish
#                       overwrites the tag same as any other image.
#
# --- Digest-pinning procedure (hard rule: pin epirhandbook's base by digest,
#     never by floating tag) ---
#
# The chicken-and-egg: epirhandbook's Dockerfile needs a digest to pin, but
# no digest exists until rbase has been pushed to GHCR at least once. Solved
# by NEVER requiring images.yaml's base_digest to be current at the moment
# it's needed:
#
#   1. BOOTSTRAP / any run where `base` is rebuilt in the SAME run as the
#      dependent image (the cascade case): the workflow does not read
#      base_digest at all. It builds+pushes the base first (an earlier
#      matrix layer), then re-resolves that tag's digest LIVE from GHCR
#      (`docker buildx imagetools inspect`) before building the dependent —
#      correct by construction, because the job dependency (`needs:`)
#      guarantees the push already landed. This is what makes the very
#      first-ever publish work with base_digest still null: the run that
#      first publishes rbase is, definitionally, also the run that must
#      build epirhandbook against it (nothing downstream has ever built
#      before), so it's always the cascade case on bootstrap.
#   2. STEADY STATE, base NOT rebuilt this run (e.g. only epirhandbook/2.5/**
#      changed): the workflow uses the recorded base_digest below as the
#      actual pin — deliberately NOT "whatever rbase:<tag> currently
#      resolves to" unchecked, which would silently follow drift. It DOES,
#      however, first confirm the recorded digest still agrees with what
#      the base's floating tag currently resolves to in the registry
#      (build_image.sh) — if the base moved since this pin was recorded,
#      the build fails loudly naming both digests, rather than silently
#      building against a pin that no longer matches anything published.
#   3. STEADY STATE, base rebuilt this run (e.g. rbase/4.3.2/** changed):
#      same as case 1 — the fresh digest is used, not the stale recorded one.
#
#   AFTER a run that rebuilds a base image, a human updates that image's
#   dependents' `base_digest` field below to match, and commits — this is a
#   deliberate MANUAL step, not automated by the workflow. Reasoning: an
#   auto-commit back to images.yaml would itself be a change to
#   images.yaml, which is the exact trigger that rebuilds ALL live images —
#   an automated write-back risks the workflow re-triggering a full rebuild
#   of everything on every single run, for no code reason. A human updating
#   the pin, deliberately, after confirming the new base is good, matches
#   this project's existing discipline of gating promotion on human/codex
#   review rather than auto-promoting.
#
#   To find the digest to paste in: read it from the build job's step
#   summary (the workflow prints "Published <name>:<tag> digest: sha256:...”
#   for every image it builds), or run:
#     docker buildx imagetools inspect ghcr.io/appliedepi/aedockerpublic/rbase:4.3.2
#   and copy the Digest: value.

images:
  - name: rbase
    dir: rbase/4.3.2
    tags: ["4.3.2"]
    base: null
    base_digest: null
    live: true
    frozen: true

  - name: epirhandbook
    dir: epirhandbook/2.5
    tags: ["2.5"]
    base: "rbase:4.3.2"
    base_digest: null
    live: true
    frozen: true
