name: Build images

# Selective cascade build, driven by a per-image OCI-revision diff. For each
# catalog image, .github/scripts/changed_images.py reads the
# org.opencontainers.image.revision label of the currently published image.
# This is a metadata-only registry read, never a `docker pull`. The script
# then diffs, since that commit, the image's own dir, the shared build inputs
# and the .github/ machinery. An image that was never published, or that has
# no revision label, is always CHANGED.
#
# .github/scripts/plan.py makes no registry or git calls of its own. It takes
# the resolved list of changed image NAMES and applies the cascade: a changed
# image rebuilds everything FROM it, transitively. A cascade respects
# `live: false`, while a direct edit to a not-live image's own files still
# does not (see build_plan() in plan.py). The planner then builds the result
# as a matrix in dependency order. A change under .github/scripts/ or
# .github/workflows/ shows up in EVERY image's own diff (see
# changed_images.py), so it rebuilds everything with no separate special case.
#
# The same mechanism is the RESUME path after a partial publish. Suppose some
# images published and others failed. A rerun (a new push, or a plain
# workflow_dispatch with no new commit) reads each image's published revision
# again. The images that succeeded now carry the current commit and are
# skipped. The images that failed still carry an older revision, or none, and
# are rebuilt. Nothing else needs to be reconciled: a rebuild after a content
# change and a clean resume use the SAME check.
#
# This is the ONLY workflow in this repo that can publish. The other
# safeguards in this file keep that true:
#   - guard-main-ref (blocker 1): publishing can only happen from
#     refs/heads/main. A hard job-level gate in this workflow enforces it.
#     The `on: push: branches: [main]` filter and the repo settings are not
#     enough. Both are config that someone can edit or bypass. See that job
#     for how it fails. The gate applies to
#     workflow_dispatch (below) in the same way.
#   - `workflow_dispatch` takes NO inputs. It is only a manual "run this
#     again" trigger, for example to resume a partial publish without a new
#     commit. It is not a general escape hatch, and guard-main-ref applies to
#     it as it does to a pushed run.
#   - Only the build-layer-N jobs get `packages: write`, because only they
#     call `docker push`. plan and guard-main-ref get the workflow-level
#     `contents: read` default and nothing else.
#   - Every build-layer-N job runs under the `publish` GitHub Environment, so
#     a required-reviewer rule CAN be configured in repo settings. See
#     CHANGELOG.md for how to turn it on. Do not assume that it is on.
#
# NO REPOSITORY SECRETS ARE REQUIRED. This workflow uses only the automatic
# `secrets.GITHUB_TOKEN`, so nothing here depends on an individual's personal
# access token. It is used for three things: docker/login-action, the actual
# `docker push`, and -- since 2026-07-25 -- the GITHUB_PAT env var fed into
# `docker build` to raise pak's GitHub API rate limit while resolving the
# SHA-pinned GitHub R packages.
#
# THAT THIRD USE CARRIES AN ACCEPTED RISK. The build-layer jobs hold
# `packages: write` so they can push, and the token is mounted into a build
# where 473 packages install, several compiled from source with their own
# post-install scripts. Any of them can therefore push to
# `ghcr.io/appliedepi/aedockerpublic/`. An earlier review recorded this as a
# blocker, and the slot previously took a separate `GH_READONLY_PAT` scoped to
# public read only -- but that secret was never configured, so the build had in
# fact been running with no token and the anonymous GitHub API rate limit.
#
# The change was requested deliberately, to keep every credential in this repo
# automatic and org-owned rather than personal. If the risk is revisited, the
# safer options are an ORG-owned fine-grained PAT scoped to public read only,
# or leaving the slot empty and accepting the anonymous rate limit. See
# CHANGELOG.md's phase 4 log.
#
# This file repeats the plan and build-layer-N jobs instead of sharing them
# through a reusable (workflow_call) workflow. A reusable workflow would
# remove the repetition. It would also add GitHub-Actions-specific mechanics:
# cross-workflow permission inheritance, and JSON-array string inputs that
# feed a matrix. Only a real push can exercise or verify those. This phase's
# brief forbids a push. Under that constraint, a single plain file that a
# static lint can check is the safer choice. Revisit this if the constraint
# lifts.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # The group name does NOT use ${{ github.ref }} (finding 8). With the ref
  # in the name, a manual dispatch off a branch would get a DIFFERENT group
  # from a push to main. The two runs would then not serialize, although both
  # can push the SAME tags. With one fixed name, every run of this file
  # shares one queue, for a push or a dispatch on any ref. guard-main-ref
  # already stops a non-main run before it can race anything. The fixed group
  # is a second layer of defense.
  group: aedockerpublic-ghcr-builds
  cancel-in-progress: false

# Workflow-level default: read-only. Only the jobs that push
# (build-layer-0..3, below) get packages: write. Each one gets it in its OWN
# job-level permissions block, never at this top level.
permissions:
  contents: read

jobs:
  # Blocker 1: publishing can only happen from refs/heads/main. This job
  # gates the ENTIRE pipeline, so a misdispatched run never checks out branch
  # content and nothing downstream runs. plan `needs:` this job. Each
  # build-layer-N job checks `needs.plan.result == 'success'`, which turns a
  # skipped plan into a skipped build. The job fails with a red X, not a grey
  # skip, so a bad dispatch is easy to see in the Actions UI.
  guard-main-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run anything off refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow may only run against refs/heads/main (it is the only workflow in this repo that can publish). Actual ref: ${{ github.ref }} (event: ${{ github.event_name }}). Refusing to plan or build." >&2
            exit 1
          fi
          echo "Ref check OK: ${{ github.ref }} (event: ${{ github.event_name }})"

  plan:
    needs: guard-main-ref
    runs-on: ubuntu-latest
    outputs:
      layer_0: ${{ steps.plan.outputs.layer_0 }}
      layer_1: ${{ steps.plan.outputs.layer_1 }}
      layer_2: ${{ steps.plan.outputs.layer_2 }}
      layer_3: ${{ steps.plan.outputs.layer_3 }}
      num_layers: ${{ steps.plan.outputs.num_layers }}
      trigger: ${{ steps.plan.outputs.trigger }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history -- changed_images.py diffs each image's
                         # published revision against this push's tip locally

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      # Hash-pinned: pip refuses any downloaded artifact that does not match
      # one of the sha256 hashes in requirements.txt. That file's header says
      # why PyYAML is hash-pinned. Unpinned was a Phase 4 round 1 finding.
      # Vendored drew four semantic-divergence blockers (CHANGELOG.md
      # section 8).
      - name: Install pinned Python dependencies for the planner
        run: python3 -m pip install --require-hashes --force-reinstall -r .github/scripts/requirements.txt

      - name: Run planner unit tests (fail loud before planning a real build)
        run: python3 .github/scripts/test_plan.py -v

      - name: Run change-detection unit tests (fail loud before planning a real build)
        run: python3 .github/scripts/test_changed_images.py -v

      # The seven generated package lists (six groups and the monolith) MUST
      # equal what generate_groups.py derives from the per-chapter lists in
      # each group image's own directory. A stale list would ship an image
      # without a chapter's packages, and every other check would stay green.
      # This step regenerates the lists in memory and fails on any byte of
      # difference. It writes nothing.
      - name: Check the generated group and monolith package lists are current
        run: python3 epirhandbook/2.9/generate_groups.py --check

      # Structural lint of the workflow files. It runs HERE, and not only in
      # checks.yml, because every build layer `needs:` this job. A red lint
      # therefore blocks publication. checks.yml runs at the same time on the
      # same push, so its copy gates nothing on main. That copy catches the
      # fault at pull-request time.
      - name: Lint the workflow files (fail loud before planning a real build)
        run: bash .github/scripts/lint_workflows.sh

      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Per-image OCI-revision diff: one metadata-only registry read per
      # catalog image (docker buildx imagetools inspect), plus a local git
      # diff. The images are public, so no docker login is needed. The step
      # runs inside retry for the same reason as the registry reads below.
      - name: Compute changed images (per-image OCI-revision diff)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python3 .github/scripts/changed_images.py --images-yaml images.yaml --images-yaml epirhandbook/2.9/images.yaml --repo "$REPO_NAME" --sha "${{ github.sha }}" > /tmp/changed_images.txt

      - name: Run planner
        id: plan
        run: |
          echo "--- changed images (own files / shared inputs / .github machinery changed since each image's published revision) ---"
          cat /tmp/changed_images.txt

          ARGS=()
          while IFS= read -r name; do
            [ -n "$name" ] && ARGS+=(--changed-image "$name")
          done < /tmp/changed_images.txt
          # Pass BOTH halves of the catalog: the hand-maintained root and the
          # current product line. Base edges cross them (epirhandbook-common
          # is FROM rbase). With only one half, the base looks like a typo and
          # the plan fails. See load_catalogs in plan.py.
          #
          # Load ONE epirhandbook catalog only. Every product line names its
          # images `epirhandbook-common`, `epirhandbook-analysis` and so on,
          # with the version in `tags:`. load_catalogs refuses a name that two
          # catalog files define, so two product lines cannot load together.
          # To cut over, SWAP this path. Do not append a second one. 2.5 to
          # 2.8 are historical and exist in git history only. The 2.6 catalog
          # no longer validates against the current schema.
          python3 .github/scripts/plan.py \
            --images-yaml images.yaml \
            --images-yaml epirhandbook/2.9/images.yaml \
            "${ARGS[@]}" > /tmp/plan.json
          echo "--- plan ---"
          cat /tmp/plan.json

          {
            echo "layer_0=$(jq -c '.layers[0] // []' /tmp/plan.json)"
            echo "layer_1=$(jq -c '.layers[1] // []' /tmp/plan.json)"
            echo "layer_2=$(jq -c '.layers[2] // []' /tmp/plan.json)"
            echo "layer_3=$(jq -c '.layers[3] // []' /tmp/plan.json)"
            echo "num_layers=$(jq -r '.num_layers' /tmp/plan.json)"
            echo "trigger=$(jq -r '.trigger' /tmp/plan.json)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan (trigger: \`$(jq -r '.trigger' /tmp/plan.json)\`)"
            echo ""
            echo '```json'
            cat /tmp/plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Layered build, base-most first ----------------------------------------
  # The static ceiling is 4 layers (0-3), one more than the current catalog.
  # The current catalog has 3 layers: rbase -> epirhandbook-common -> the six
  # group images and the monolith. plan.py raises before any build starts if
  # a catalog needs a 5th layer (see MAX_SUPPORTED_LAYERS in plan.py). So a
  # catalog that is too deep gives a planning error, never a partial publish.
  # To support a 5th layer, add a `build-layer-4` job below with the same
  # pattern AND increase MAX_SUPPORTED_LAYERS in plan.py.
  #
  # Each matrix entry is a full image record from plan.py (name, dir, tags,
  # base_name/base_tag/base_freshly_built/context). build_image.sh uses it
  # directly. So only the planner and that one script know how to resolve a
  # base image. There is no copy per layer.
  #
  # The conditions use `always()` plus explicit needs.*.result checks, not
  # bare success(). The default implicit condition treats an upstream SKIPPED
  # job as a failure. build-layer-1 would then skip whenever build-layer-0 had
  # nothing to do. If guard-main-ref fails, plan is skipped, and
  # needs.plan.result is 'skipped'. The `== 'success'` check below already
  # fails on that, with no extra wiring. The layer output of plan.py has no
  # gaps, so a layer with nothing to do does not occur in practice. The
  # condition does not depend on that invariant.
  build-layer-0:
    needs: [guard-main-ref, plan]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.num_layers) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_0) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
          # `docker build`, where 473 CRAN/Bioconductor/GitHub packages
          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          # This image's description, from its catalog record. The command
          # below reads it as "$IMAGE_DESCRIPTION", never as a direct
          # expression interpolation. A description is prose, and a quote or a
          # $(...) inside a command string changes the command the runner runs.
          IMAGE_DESCRIPTION: ${{ matrix.image.description }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}" "$IMAGE_DESCRIPTION"

  build-layer-1:
    needs: [guard-main-ref, plan, build-layer-0]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-0.result == 'success' || needs.build-layer-0.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_1) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
