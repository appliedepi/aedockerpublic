          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          # This image's description, from its catalog record. The command
          # below reads it as "$IMAGE_DESCRIPTION", never as a direct
          # expression interpolation. A description is prose, and a quote or a
          # $(...) inside a command string changes the command the runner runs.
          IMAGE_DESCRIPTION: ${{ matrix.image.description }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}" "$IMAGE_DESCRIPTION"

  build-layer-2:
    needs: [guard-main-ref, plan, build-layer-1]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-1.result == 'success' || needs.build-layer-1.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 2
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_2) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
          # `docker build`, where 473 CRAN/Bioconductor/GitHub packages
          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          # This image's description, from its catalog record. The command
          # below reads it as "$IMAGE_DESCRIPTION", never as a direct
          # expression interpolation. A description is prose, and a quote or a
          # $(...) inside a command string changes the command the runner runs.
          IMAGE_DESCRIPTION: ${{ matrix.image.description }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}" "$IMAGE_DESCRIPTION"

  build-layer-3:
    needs: [guard-main-ref, plan, build-layer-2]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-2.result == 'success' || needs.build-layer-2.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 3
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_3) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
