name: Build images

# Selective + cascade build, per-image OCI-revision diff: for each catalog
# image, .github/scripts/changed_images.py reads that image's CURRENTLY-
# PUBLISHED org.opencontainers.image.revision label (a metadata-only
# registry read, never a `docker pull`) and diffs its own dir + the shared
# build inputs + the .github/ machinery since that commit. Never-published,
# or no revision label, is always CHANGED. .github/scripts/plan.py (pure,
# no registry/git calls of its own) then takes that resolved list of
# changed image NAMES, applies the cascade (a changed image rebuilds
# everything FROM it, transitively -- but a cascade respects `live: false`
# while a direct edit to a not-live image's own files still does not; see
# plan.py's build_plan()), and builds the result as a matrix in dependency
# order. A change under .github/scripts/ or .github/workflows/ shows up in
# EVERY image's own diff (see changed_images.py), so it rebuilds everything
# without a separate special case.
#
# This same mechanism is also the RESUME path for a partial publish: after
# a run where some images published and others failed, a rerun (a new push,
# or a plain workflow_dispatch with no new commit at all) re-reads each
# image's published revision -- the ones that succeeded now carry the
# current commit and are skipped; the one(s) that failed still carry an
# older (or no) revision and are rebuilt. There is nothing else to
# reconcile: content-change-rebuild and clean resume are the SAME check.
#
# This is the ONLY workflow in this repo that can publish. Every other
# safeguard in this file exists to keep that true:
#   - guard-main-ref (blocker 1): publishing may only ever happen from
#     refs/heads/main, enforced HERE, in the workflow, as a hard job-level
#     gate -- never only via this file's own `on: push: branches: [main]`
#     filter or any repo setting, both of which are themselves config that
#     could be edited or bypassed. See that job for exactly how it fails.
#     Applies equally to workflow_dispatch (below).
#   - `workflow_dispatch` takes NO inputs -- it exists only as a manual
#     "run this again" trigger (e.g. to resume a partial publish without
#     waiting for a new commit), never a general escape hatch, and
#     guard-main-ref applies to it exactly the same as to a pushed run.
#   - `packages: write` is scoped to ONLY the build-layer-N jobs, which are
#     the only ones that call `docker push`. plan and guard-main-ref get the
#     workflow-level `contents: read` default and nothing else.
#   - Every build-layer-N job runs under the `publish` GitHub Environment,
#     so a required-reviewer rule CAN be configured in repo settings (see
#     PROJECT.md for how to turn that on -- it is not assumed to be on).
#
# NO REPOSITORY SECRETS ARE REQUIRED. This workflow uses only the automatic
# `secrets.GITHUB_TOKEN`, so nothing here depends on an individual's personal
# access token. It is used for three things: docker/login-action, the actual
# `docker push`, and -- since 2026-07-25 -- the GITHUB_PAT env var fed into
# `docker build` to raise pak's GitHub API rate limit while resolving the
# SHA-pinned GitHub R packages.
#
# THAT THIRD USE CARRIES AN ACCEPTED RISK. The build-layer jobs hold
# `packages: write` so they can push, and the token is mounted into a build
# where 473 packages install, several compiled from source with their own
# post-install scripts. Any of them can therefore push to
# `ghcr.io/appliedepi/aedockerpublic/`. An earlier review recorded this as a
# blocker, and the slot previously took a separate `GH_READONLY_PAT` scoped to
# public read only -- but that secret was never configured, so the build had in
# fact been running with no token and the anonymous GitHub API rate limit.
#
# The change was requested deliberately, to keep every credential in this repo
# automatic and org-owned rather than personal. If the risk is revisited, the
# safer options are an ORG-owned fine-grained PAT scoped to public read only,
# or leaving the slot empty and accepting the anonymous rate limit. See
# PROJECT.md section 8.
#
# This file deliberately duplicates the plan + build-layer-N jobs rather
# than sharing them via a reusable (workflow_call) workflow. That would
# remove the duplication, but it introduces GitHub-Actions-specific
# mechanics (cross-workflow permission inheritance, JSON-array string
# inputs feeding a matrix) that cannot be exercised or verified without an
# actual push -- which this phase's brief explicitly forbids. A single
# plain, statically-lintable file is the safer choice given that
# constraint. Revisit if that constraint ever lifts.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Deliberately NOT parameterized by ${{ github.ref }} (finding 8): a
  # manual dispatch off a branch would otherwise get a DIFFERENT group than
  # a push to main, so the two would NOT serialize against each other, even
  # though both are capable of pushing the SAME tags. One fixed name means
  # every run of this file -- push or dispatch, on any ref -- shares one
  # queue. (guard-main-ref also means a non-main run never gets far enough
  # to race anything, but the group is ref-independent regardless, as
  # defense in depth.)
  group: aedockerpublic-ghcr-builds
  cancel-in-progress: false

# Workflow-level default: read-only. Only the jobs that actually push
# (build-layer-0..3, below) elevate to packages: write, and each does so in
# its OWN job-level permissions block -- never at this top level.
permissions:
  contents: read

jobs:
  # Blocker 1: publishing may only ever happen from refs/heads/main. A
  # job-level `if:` that gates the ENTIRE pipeline is used instead of a
  # later fail-fast step, so a misdispatched run never even checks out
  # branch content -- nothing downstream runs at all (plan `needs:` this
  # job, and every build-layer-N job's existing `needs.plan.result ==
  # 'success'` check already turns a skipped plan into a skipped build).
  # Fails LOUD (a red X, not a quiet grey skip) so a bad dispatch is
  # unmissable in the Actions UI, not just silently absent.
  guard-main-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run anything off refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow may only run against refs/heads/main (it is the only workflow in this repo that can publish). Actual ref: ${{ github.ref }} (event: ${{ github.event_name }}). Refusing to plan or build." >&2
            exit 1
          fi
          echo "Ref check OK: ${{ github.ref }} (event: ${{ github.event_name }})"

  plan:
    needs: guard-main-ref
    runs-on: ubuntu-latest
    outputs:
      layer_0: ${{ steps.plan.outputs.layer_0 }}
      layer_1: ${{ steps.plan.outputs.layer_1 }}
      layer_2: ${{ steps.plan.outputs.layer_2 }}
      layer_3: ${{ steps.plan.outputs.layer_3 }}
      num_layers: ${{ steps.plan.outputs.num_layers }}
      trigger: ${{ steps.plan.outputs.trigger }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history -- changed_images.py diffs each image's
                         # published revision against this push's tip locally

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      # Hash-pinned: refuses to install anything whose downloaded artifact
      # does not match one of requirements.txt's recorded sha256 hashes. See
      # that file's header for why PyYAML is hash-pinned rather than either
      # left unpinned (Phase 4 round 1 finding) or vendored (the four
      # semantic-divergence blockers that decision then drew -- PROJECT.md
      # section 8).
      - name: Install pinned Python dependencies for the planner
        run: python3 -m pip install --require-hashes --force-reinstall -r .github/scripts/requirements.txt

      - name: Run planner unit tests (fail loud before planning a real build)
        run: python3 .github/scripts/test_plan.py -v

      - name: Run change-detection unit tests (fail loud before planning a real build)
        run: python3 .github/scripts/test_changed_images.py -v

      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Per-image OCI-revision diff: a metadata-only registry read per
      # catalog image (docker buildx imagetools inspect), plus a local git
      # diff -- no docker login needed (reads of public images), wrapped in
      # retry for the same reason the registry reads below are.
      - name: Compute changed images (per-image OCI-revision diff)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: python3 .github/scripts/changed_images.py --images-yaml images.yaml --images-yaml epirhandbook/2.8/images.yaml --repo "$REPO_NAME" --sha "${{ github.sha }}" > /tmp/changed_images.txt

      - name: Run planner
        id: plan
        run: |
          echo "--- changed images (own files / shared inputs / .github machinery changed since each image's published revision) ---"
          cat /tmp/changed_images.txt

          ARGS=()
          while IFS= read -r name; do
            [ -n "$name" ] && ARGS+=(--changed-image "$name")
          done < /tmp/changed_images.txt
          # BOTH halves of the catalog: the hand-maintained root and the
          # current product line's. Base edges cross them (epirhandbook-common
          # is FROM rbase), so passing only one makes the base look like a typo
          # and the plan dies. See plan.py's load_catalogs.
          #
          # EXACTLY ONE epirhandbook catalog is ever loaded. Product lines are
          # mutually exclusive by construction, not by accident: 2.7 and 2.8
          # both name their base image `epirhandbook-common` (the version lives
          # in `tags:`), and both claim the same 49 .qmd, so loading two at once
          # is a hard duplicate error. Cutting over means SWAPPING this path,
          # never appending. 2.5, 2.6 and 2.7 are historical -- 2.6's catalog no
          # longer even validates against the current schema.
          python3 .github/scripts/plan.py \
            --images-yaml images.yaml \
            --images-yaml epirhandbook/2.8/images.yaml \
            "${ARGS[@]}" > /tmp/plan.json
          echo "--- plan ---"
          cat /tmp/plan.json

          {
            echo "layer_0=$(jq -c '.layers[0] // []' /tmp/plan.json)"
            echo "layer_1=$(jq -c '.layers[1] // []' /tmp/plan.json)"
            echo "layer_2=$(jq -c '.layers[2] // []' /tmp/plan.json)"
            echo "layer_3=$(jq -c '.layers[3] // []' /tmp/plan.json)"
            echo "num_layers=$(jq -r '.num_layers' /tmp/plan.json)"
            echo "trigger=$(jq -r '.trigger' /tmp/plan.json)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan (trigger: \`$(jq -r '.trigger' /tmp/plan.json)\`)"
            echo ""
            echo '```json'
            cat /tmp/plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Layered build, base-most first ----------------------------------------
  # Static ceiling of 4 layers (0-3): comfortably more than today's catalog
  # (rbase -> epirhandbook is 2 layers) and more than the depth Phase 5a's
  # roadmap implies (rbase -> epirhandbook-common -> ~50 per-chapter images
  # would be 3). plan.py itself now HARD-FAILS (raises, before any build
  # starts) if a catalog needs a 5th layer -- see plan.py's
  # MAX_SUPPORTED_LAYERS -- so exceeding this ceiling is a loud planning
  # error, never a silent partial publish. If the catalog ever needs a 5th
  # layer, add a `build-layer-4` job below following the exact same pattern
  # AND bump MAX_SUPPORTED_LAYERS in plan.py.
  #
  # Each matrix entry is a full image record from plan.py (name, dir, tags,
  # base_name/base_tag/base_freshly_built/context) --
  # build_image.sh consumes it directly, so there is exactly one place (the
  # planner, then this one script) that knows how to resolve a base image,
  # not one copy per layer.
  #
  # `always()` plus explicit needs.*.result checks (rather than bare
  # success()): a job's default implicit condition treats an upstream SKIPPED
  # job the same as a blocker, which would wrongly skip build-layer-1 purely
  # because build-layer-0 had nothing to do in a run that never touches it
  # (or because guard-main-ref failed and plan was skipped entirely --
  # needs.plan.result would be 'skipped', which already fails the
  # `== 'success'` check below without any extra wiring). plan.py's layer
  # output is always dense (no gaps), so the "nothing to do" case never
  # actually arises in practice, but the condition is written to not depend
  # on that invariant either.
  build-layer-0:
    needs: [guard-main-ref, plan]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.num_layers) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_0) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
          # `docker build`, where 473 CRAN/Bioconductor/GitHub packages
          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}"

  build-layer-1:
    needs: [guard-main-ref, plan, build-layer-0]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-0.result == 'success' || needs.build-layer-0.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_1) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
          # `docker build`, where 473 CRAN/Bioconductor/GitHub packages
          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}"

  build-layer-2:
    needs: [guard-main-ref, plan, build-layer-1]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-1.result == 'success' || needs.build-layer-1.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 2
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_2) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
          # SHA-pinned GitHub R packages.
          #
          # ACCEPTED RISK, decided deliberately -- read before changing.
          # This job holds packages: write (see the job's own permissions:
          # block above) so it can push. This token is mounted into
          # `docker build`, where 473 CRAN/Bioconductor/GitHub packages
          # install, several compiled from source with their own
          # post-install scripts. Any of them can therefore push to
          # ghcr.io/appliedepi/aedockerpublic/.
          #
          # An earlier review recorded that as a blocker, and this slot
          # took GH_READONLY_PAT instead: a fine-grained PAT scoped to
          # public read only. That secret was never actually configured,
          # so in practice the build ran with no token and the GitHub
          # lookups used the anonymous rate limit.
          #
          # Safer alternatives if this is revisited: an ORG-owned
          # fine-grained PAT scoped to public read only, or leaving the
          # slot empty and accepting the anonymous rate limit -- which is
          # what was happening anyway.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}"

  build-layer-3:
    needs: [guard-main-ref, plan, build-layer-2]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-layer-2.result == 'success' || needs.build-layer-2.result == 'skipped') &&
      fromJSON(needs.plan.outputs.num_layers) > 3
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.layer_3) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set lowercase repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image.name }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          # Raises pak's GitHub API rate limit while resolving the
