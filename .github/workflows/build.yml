          # can write to ghcr.io/appliedepi/aedockerpublic/. GH_READONLY_PAT
          # is a SEPARATE repository secret: a fine-grained PAT scoped to
          # public read only (no packages:write, no repo write) -- see
          # PROJECT.md section 8 for how to create/rotate it. If it is not
          # configured, this evaluates to an empty string and the build
          # proceeds with NO token at all (see build_image.sh's header) --
          # it never falls back to secrets.GITHUB_TOKEN or any other
          # write-capable credential. GITHUB_TOKEN remains in use above,
          # for docker/login-action and the eventual `docker push` -- that
          # is its legitimate use; the point is only that it must never
          # enter the build itself.
          GITHUB_PAT: ${{ secrets.GH_READONLY_PAT }}
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: bash .github/scripts/build_image.sh publish "$REPO_NAME" "${{ matrix.image.name }}" "${{ matrix.image.dir }}" "${{ join(matrix.image.tags, ',') }}" "${{ matrix.image.base_name }}" "${{ matrix.image.base_tag }}" "${{ matrix.image.base_digest }}" "${{ matrix.image.base_freshly_built }}" "${{ github.sha }}" "${{ matrix.image.context }}"
