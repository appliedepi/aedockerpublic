name: Checks

# Cheap, publish-nothing checks that run on every pull request and every
# push, so a stale generated list or a broken planner is caught before a
# merge to main starts a real image build (build.yml runs on main only).
# Keep this file in step with the plan job of build.yml: the same tests and
# the same generator check, minus anything that touches the registry. The
# workflow lint below is the one deliberate exception: it checks the workflow
# files themselves, so it belongs at pull-request time and has no counterpart
# in the build job.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install pinned Python dependencies for the planner
        run: python3 -m pip install --require-hashes --force-reinstall -r .github/scripts/requirements.txt

      - name: Run planner unit tests
        run: python3 .github/scripts/test_plan.py -v

      - name: Run change-detection unit tests
        run: python3 .github/scripts/test_changed_images.py -v

      - name: Check the generated group and monolith package lists are current
        run: python3 epirhandbook/2.9/generate_groups.py --check

      # Load and validate both halves of the catalog exactly as the planner
      # does, with no changed images: a schema error in either file fails
      # here instead of in the first real build.
      - name: Validate the image catalogs
        run: python3 .github/scripts/plan.py --images-yaml images.yaml --images-yaml epirhandbook/2.9/images.yaml > /dev/null

      # Structural lint of the workflow files. Nothing else here looks at
      # them: the planner tests say nothing about build.yml, and the
      # `yaml.safe_load` parse below cannot see a malformed `uses:`
      # reference, a `needs:` edge to a job that does not exist, a shell
      # fault, or an expression that cannot resolve.
      #
      # The same script runs in build.yml's `plan` job, which is what makes
      # it a publication gate. This copy catches the fault at pull-request
      # time instead. See the script's header for what actionlint does not
      # cover.
      - name: Lint the workflow files
        run: bash .github/scripts/lint_workflows.sh
